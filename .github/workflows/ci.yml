name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --workspace --verbose
      
      - name: Run tests
        run: cargo test --workspace --verbose
      
      - name: Run examples
        run: |
          cargo run --example tool_definition
          cargo run --example adapter
          cargo run --example mcp --features mcp

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # One job, one coverage run, two gates fed by it: cargo-tarpaulin runs the
  # whole suite under instrumentation (it exits non-zero on any test failure,
  # so the coverage run IS the test run) and writes lcov.info, which
  # cargo-crap then scores. cargo-crap never runs tests itself — it parses
  # source with syn and reads the LCOV, scoring CRAP(m) = CC²·(1−cov)³ + CC.
  # Without the coverage feed every function scores cov=0 and CRAP collapses
  # to CC³+CC, so the complexity gate would measure nothing; that is why the
  # two live in one job.
  #
  # This job deliberately does NOT multiply across the `test` job's matrix:
  # coverage numbers differ per OS (line maps, std instrumentation, path
  # handling) while the estate tracks ONE number per repo, and a 6-cell
  # matrix (3 OS × stable/beta) would spend 6× the fleet minutes for zero
  # extra signal. One ubuntu entry is the measured estate convention.
  #
  # This public repo runs on GitHub-hosted runners, which follows the repo's
  # existing convention (every other job here is ubuntu-latest).
  #
  # Engine choice is MEASURED, not preferred: the estate fleet runners
  # (dirmacs-ci, sysbox-confined containers) cannot run tarpaulin's ptrace
  # engine ("ASLR disable failed: EPERM", measured on dirmacs/skywalkers run
  # 38064108686). `--engine Llvm` (source-based -Cinstrument-coverage +
  # llvm-profdata + llvm-cov, backed by the llvm-tools-preview component
  # below) works everywhere and is the estate-wide standard, so the numbers
  # this gate reports are comparable with every other repo's gate. Local
  # measurement of this repo ran the same suite under the ptrace engine;
  # llvm-vs-ptrace coverage deltas on comparable suites are inside the
  # floor's ~3pp margin, and the threshold below carries that margin
  # deliberately.
  #
  # Tool pinning: both tools install from per-arch release tarballs at exact
  # versions and each version is asserted — two runs cannot disagree because
  # one host happened to have a newer cargo-crap. Versions are crates.io
  # max_stable_version at authoring: tarpaulin 0.37.5, cargo-crap 0.6.1.
  # thulp is a public repo, so the GitHub-hosted runners every other job here
  # already uses stay in place — no runner-label gymnastics needed.
  #
  # The pre-existing `coverage` job above stays as-is: it uploads to codecov
  # with fail_ci_if_error: false, i.e. it reports but never gates. This job
  # is what makes coverage (and complexity) actually gate the repo.
  coverage-crap:
    name: Coverage + CRAP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repo-specific constants, measured on the first run — see the PR that
      # added this job for the numbers and the ratchet.
      #
      # Measured under tarpaulin 0.37.5 / ptrace on the build host (stable,
      # 2026-10-10): line coverage 53.71% (1419/2642 lines); 308 tests in 12
      # test binaries, all passing.
      #
      # CRAP measured on the same run's LCOV (cargo-crap 0.6.1, workspace,
      # 500 functions scored). Whole-workspace worst is 1892 =
      # handle_config_commands (crates/thulp-cli/src/commands/config.rs:158,
      # CC 43, 0% coverage) — the shipped bin's dispatch glue, which tarpaulin
      # structurally cannot measure (it runs test binaries, not the bin; the
      # cli integration tests drive the bin as a subprocess whose profile is
      # not attributed). The CRAP step below therefore excludes the bin
      # dispatch surface (`src/commands/**`, `src/main.rs`; the same posture
      # as the proven git-sync job excluding its CLI entry point), and the
      # threshold is set against the maintained library surface instead:
      # worst 132 = ares_to_thulp_definition
      # (crates/thulp-mcp/src/ares_integration.rs:174, CC 11, no coverage data
      # — the `ares` feature is off by default), followed by 132 =
      # SkillLoader::load_all (CC 11, 0%) and 110 =
      # SkillFile::classify_supporting_file (CC 10, 0%). Zero functions sit
      # above 145 on that surface.
      COVERAGE_FLOOR: "50"
      CRAP_THRESHOLD: "145"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview backs the llvm engine (the documented ptrace
          # fallback) and any llvm-profdata/llvm-cov invocation.
          components: llvm-tools-preview

      - name: Install Protoc
        # thulp-mcp depends on rs-utcp (tonic/prost build script), so every
        # job in this file installs protoc. Same convention here.
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargo.lock is committed, not generated
        # --locked below exits non-zero if the lockfile is missing or would have
        # to change, so the dependency set can only move when a human commits a
        # reviewed lockfile. That mechanism needs the file to exist first.
        run: git ls-files --error-unmatch Cargo.lock

      - name: install pinned coverage + CRAP tools
        run: |
          set -euo pipefail
          TARPAULIN_VERSION=0.37.5
          CRAP_VERSION=0.6.1
          case "$(uname -m)" in
            aarch64) arch=aarch64 ;;
            x86_64)  arch=x86_64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          # $GITHUB_PATH only affects LATER steps, not this one -- the version
          # assertions below run here, so the dir must be on PATH inside this
          # same script.
          export PATH="$HOME/.local/bin:$PATH"
          curl -sSLf "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-${arch}-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          curl -sSLf "https://github.com/minikin/cargo-crap/releases/download/v${CRAP_VERSION}/cargo-crap-${arch}-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo-tarpaulin --version | grep -qx "tarpaulin ${TARPAULIN_VERSION}"
          cargo-crap --version | grep -qx "cargo-crap ${CRAP_VERSION}"

      - name: coverage gate (tarpaulin, llvm engine)
        # Workspace repo (crates/* plus the examples package), so --workspace.
        run: >-
          cargo tarpaulin --engine Llvm --locked --workspace
          --out Lcov --fail-under "$COVERAGE_FLOOR" --timeout 300

      - name: CRAP gate (fed by this run's coverage)
        # `--exclude 'src/commands/**' --exclude 'src/main.rs'`: thulp-cli is
        # the shipped bin — clap parsing and per-subcommand dispatch glue.
        # Tarpaulin measures test binaries, not the shippable bin, so the
        # crate's handlers measure 0% structurally (the cli integration tests
        # do drive the bin, but as a subprocess whose profile is not
        # attributed to this run) and handle_config_commands scores CRAP 1892
        # (CC 43). Gate that number and the ceiling measures nothing;
        # silence the bin dispatch surface and the ceiling is meaningful over
        # the 11 library members + examples. The globs are crate-root
        # relative, so they only touch thulp-cli (no other member has
        # src/main.rs or src/commands). Same posture as the proven git-sync
        # job excluding its CLI entry point; the bin surface stays a known
        # complexity-debt caveat, tracked in the PR body.
        run: >-
          cargo crap --lcov lcov.info --workspace
          --exclude 'src/commands/**' --exclude 'src/main.rs'
          --threshold "$CRAP_THRESHOLD" --fail-above
          --format json > crap.json

      - name: write the run summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Coverage + CRAP gate"
            echo
            if [ -f lcov.info ]; then
              awk -F: '/^LH:/{lh+=$2} /^LF:/{lf+=$2} END {if (lf>0) printf "Line coverage: %.2f%% (%d/%d lines)\n", 100*lh/lf, lh, lf; else print "Line coverage: no LCOV data"}' lcov.info
            else
              echo "Line coverage: no lcov.info (the coverage run did not complete)"
            fi
            if [ -f crap.json ]; then
              # Shell-only parse: the fleet runner containers carry no python3,
              # and a crashing summary must not redden a gate that passed.
              vals=$(tr -d ' \n' < crap.json | grep -o '"crap":[0-9.]*' | cut -d: -f2)
              if [ -n "$vals" ]; then
                n=$(printf '%s\n' "$vals" | grep -c .)
                worst=$(printf '%s\n' "$vals" | sort -g | tail -1)
                echo "Functions scored: $n; worst CRAP: $worst; threshold $CRAP_THRESHOLD"
              else
                echo "WARNING: crap.json present but no entries parsed"
              fi
            else
              echo "CRAP: no crap.json (the CRAP step did not complete)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
